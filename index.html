<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎡 Wheel of Fortune</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 30px 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
            color: #333;
            font-weight: 600;
        }
        
        .wheel-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
        }
        
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }
        
        .spin-button {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #FF6B6B;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }
        
        .spin-button:hover:not(:disabled) {
            background-color: #ff5252;
            transform: translateY(-2px);
        }
        
        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            border: 2px solid #FF6B6B;
            display: none;
        }
        
        .result-box.show {
            display: block;
        }
        
        .result-label {
            font-size: 14px;
            color: #666;
            margin: 0 0 8px 0;
        }
        
        .result-text {
            font-size: 24px;
            font-weight: bold;
            color: #FF6B6B;
            margin: 0;
        }
        
        .items-section {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
        }
        
        .section-title {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #333;
            font-weight: 600;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
        }
        
        .add-button {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background-color: #4ECDC4;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .add-button:hover {
            background-color: #3ab5a8;
        }
        
        .items-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .item-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #f0f0f0;
            border-radius: 20px;
            font-size: 14px;
            color: #333;
        }
        
        .remove-button {
            background: none;
            border: none;
            font-size: 20px;
            color: #999;
            cursor: pointer;
            padding: 0;
            margin-left: 4px;
            line-height: 1;
        }
        
        .remove-button:hover {
            color: #ff5252;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎡 Wheel of Fortune</h1>
        
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
        </div>
        
        <button class="spin-button" id="spinButton">SPIN THE WHEEL</button>
        
        <div class="result-box" id="resultBox">
            <p class="result-label">🎉 Winner:</p>
            <p class="result-text" id="resultText"></p>
        </div>
        
        <div class="items-section">
            <h2 class="section-title">Wheel Items</h2>
            
            <div class="input-container">
                <input type="text" id="itemInput" placeholder="Add new item..." />
                <button class="add-button" id="addButton">Add Item</button>
            </div>
            
            <div class="items-list" id="itemsList"></div>
        </div>
    </div>

    <script>
        class WheelOfFortune {
            constructor() {
                this.items = ['Option 1', 'Option 2', 'Option 3', 'Option 4', 'Option 5'];
                this.isSpinning = false;
                this.rotation = 0;
                this.wheelRadius = 150;
                this.spinDuration = 3;
                
                this.canvas = document.getElementById('wheelCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.spinButton = document.getElementById('spinButton');
                this.itemInput = document.getElementById('itemInput');
                this.addButton = document.getElementById('addButton');
                this.itemsList = document.getElementById('itemsList');
                this.resultBox = document.getElementById('resultBox');
                this.resultText = document.getElementById('resultText');
                
                this.init();
            }
            
            init() {
                this.spinButton.addEventListener('click', () => this.spin());
                this.addButton.addEventListener('click', () => this.addItem());
                this.itemInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addItem();
                });
                
                this.render();
                this.updateItemsList();
            }
            
            addItem() {
                const value = this.itemInput.value.trim();
                if (value) {
                    this.items.push(value);
                    this.itemInput.value = '';
                    this.render();
                    this.updateItemsList();
                    this.resultBox.classList.remove('show');
                }
            }
            
            removeItem(index) {
                this.items.splice(index, 1);
                this.render();
                this.updateItemsList();
                this.resultBox.classList.remove('show');
            }
            
            updateItemsList() {
                this.itemsList.innerHTML = this.items.map((item, index) => `
                    <div class="item-tag">
                        <span>${item}</span>
                        <button class="remove-button" onclick="wheel.removeItem(${index})">×</button>
                    </div>
                `).join('');
            }
            
            render() {
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.save();
                this.ctx.translate(centerX, centerY);
                this.ctx.rotate((this.rotation * Math.PI) / 180);
                
                const sliceAngle = 360 / this.items.length;
                const colors = [
                    '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
                    '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B739', '#52C9A8',
                ];
                
                this.items.forEach((item, index) => {
                    const startAngle = (index * sliceAngle - 90) * (Math.PI / 180);
                    const endAngle = ((index + 1) * sliceAngle - 90) * (Math.PI / 180);
                    
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, this.wheelRadius, startAngle, endAngle);
                    this.ctx.lineTo(0, 0);
                    this.ctx.fillStyle = colors[index % colors.length];
                    this.ctx.fill();
                    
                    this.ctx.strokeStyle = '#ffffff';
                    this.ctx.lineWidth = 2;
                    this.ctx.stroke();
                    
                    this.ctx.save();
                    this.ctx.rotate(startAngle + sliceAngle * (Math.PI / 180) / 2);
                    this.ctx.textAlign = 'right';
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.font = 'bold 14px Arial';
                    this.ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    this.ctx.shadowBlur = 4;
                    
                    const textRadius = this.wheelRadius - 40;
                    this.ctx.fillText(item, textRadius, 5);
                    this.ctx.restore();
                });
                
                this.ctx.beginPath();
                this.ctx.arc(0, 0, 20, 0, 2 * Math.PI);
                this.ctx.fillStyle = '#333';
                this.ctx.fill();
                this.ctx.strokeStyle = '#fff';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();
                
                this.ctx.restore();
                
                this.ctx.fillStyle = '#333';
                this.ctx.beginPath();
                this.ctx.moveTo(centerX, centerY - this.wheelRadius - 15);
                this.ctx.lineTo(centerX - 10, centerY - this.wheelRadius);
                this.ctx.lineTo(centerX + 10, centerY - this.wheelRadius);
                this.ctx.fill();
            }
            
            spin() {
                if (this.isSpinning || this.items.length === 0) return;
                
                this.isSpinning = true;
                this.spinButton.disabled = true;
                this.resultBox.classList.remove('show');
                
                const spinAmount = Math.random() * 360 + 720;
                const newRotation = (this.rotation + spinAmount) % 360;
                
                const startTime = Date.now();
                const animate = () => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    const progress = Math.min(elapsed / this.spinDuration, 1);
                    
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    const currentRotation = (this.rotation + spinAmount * easeOut) % 360;
                    this.rotation = currentRotation;
                    this.render();
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        this.rotation = newRotation;
                        this.render();
                        this.isSpinning = false;
                        this.spinButton.disabled = false;
                        
                        const normalizedRotation = (360 - (newRotation % 360)) % 360;
                        const sliceAngle = 360 / this.items.length;
                        const winnerIndex = Math.floor(normalizedRotation / sliceAngle) % this.items.length;
                        
                        this.resultText.textContent = this.items[winnerIndex];
                        this.resultBox.classList.add('show');
                    }
                };
                
                requestAnimationFrame(animate);
            }
        }
        
        const wheel = new WheelOfFortune();
    </script>
</body>
</html>
