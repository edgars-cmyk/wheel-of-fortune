<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎡 Wheel of Fortune</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        #root {
            width: 100%;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const WheelOfFortune = () => {
          const [items, setItems] = React.useState([
            'Option 1',
            'Option 2',
            'Option 3',
            'Option 4',
            'Option 5',
          ]);
          const [inputValue, setInputValue] = React.useState('');
          const [isSpinning, setIsSpinning] = React.useState(false);
          const [rotation, setRotation] = React.useState(0);
          const [selectedItem, setSelectedItem] = React.useState(null);
          const canvasRef = React.useRef(null);
          const wheelRadius = 150;
          const spinDuration = 3;

          const handleAddItem = () => {
            if (inputValue.trim()) {
              setItems([...items, inputValue.trim()]);
              setInputValue('');
            }
          };

          const handleRemoveItem = (index) => {
            setItems(items.filter((_, i) => i !== index));
          };

          React.useEffect(() => {
            const canvas = canvasRef.current;
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate((rotation * Math.PI) / 180);

            const sliceAngle = 360 / items.length;
            const colors = [
              '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8',
              '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B739', '#52C9A8',
            ];

            items.forEach((item, index) => {
              const startAngle = (index * sliceAngle - 90) * (Math.PI / 180);
              const endAngle = ((index + 1) * sliceAngle - 90) * (Math.PI / 180);

              ctx.beginPath();
              ctx.arc(0, 0, wheelRadius, startAngle, endAngle);
              ctx.lineTo(0, 0);
              ctx.fillStyle = colors[index % colors.length];
              ctx.fill();

              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 2;
              ctx.stroke();

              ctx.save();
              ctx.rotate(startAngle + sliceAngle * (Math.PI / 180) / 2);
              ctx.textAlign = 'right';
              ctx.fillStyle = '#ffffff';
              ctx.font = 'bold 14px Arial';
              ctx.shadowColor = 'rgba(0,0,0,0.5)';
              ctx.shadowBlur = 4;

              const textRadius = wheelRadius - 40;
              ctx.fillText(item, textRadius, 5);
              ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, 2 * Math.PI);
            ctx.fillStyle = '#333';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();

            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - wheelRadius - 15);
            ctx.lineTo(centerX - 10, centerY - wheelRadius);
            ctx.lineTo(centerX + 10, centerY - wheelRadius);
            ctx.fill();
          }, [items, rotation]);

          const handleSpin = () => {
            if (isSpinning || items.length === 0) return;

            setIsSpinning(true);
            const spinAmount = Math.random() * 360 + 720;
            const newRotation = (rotation + spinAmount) % 360;

            const startTime = Date.now();
            const animate = () => {
              const elapsed = (Date.now() - startTime) / 1000;
              const progress = Math.min(elapsed / spinDuration, 1);

              const easeOut = 1 - Math.pow(1 - progress, 3);
              const currentRotation = (rotation + spinAmount * easeOut) % 360;
              setRotation(currentRotation);

              if (progress < 1) {
                requestAnimationFrame(animate);
              } else {
                setRotation(newRotation);
                setIsSpinning(false);

                const normalizedRotation = (360 - (newRotation % 360)) % 360;
                const sliceAngle = 360 / items.length;
                const winnerIndex = Math.floor(normalizedRotation / sliceAngle) % items.length;
                setSelectedItem(items[winnerIndex]);
              }
            };

            requestAnimationFrame(animate);
          };

          return (
            <div style={styles.container}>
              <h1 style={styles.title}>🎡 Wheel of Fortune</h1>

              <div style={styles.wheelContainer}>
                <canvas
                  ref={canvasRef}
                  width={400}
                  height={400}
                  style={styles.canvas}
                />
              </div>

              <button
                onClick={handleSpin}
                disabled={isSpinning || items.length === 0}
                style={{
                  ...styles.spinButton,
                  opacity: isSpinning || items.length === 0 ? 0.6 : 1,
                  cursor: isSpinning || items.length === 0 ? 'not-allowed' : 'pointer',
                }}
              >
                {isSpinning ? 'SPINNING...' : 'SPIN THE WHEEL'}
              </button>

              {selectedItem && !isSpinning && (
                <div style={styles.resultBox}>
                  <p style={styles.resultLabel}>🎉 Winner:</p>
                  <p style={styles.resultText}>{selectedItem}</p>
                </div>
              )}

              <div style={styles.itemsSection}>
                <h2 style={styles.sectionTitle}>Wheel Items</h2>

                <div style={styles.inputContainer}>
                  <input
                    type="text"
                    value={inputValue}
                    onChange={(e) => setInputValue(e.target.value)}
                    onKeyPress={(e) => e.key === 'Enter' && handleAddItem()}
                    placeholder="Add new item..."
                    style={styles.input}
                  />
                  <button onClick={handleAddItem} style={styles.addButton}>
                    Add Item
                  </button>
                </div>

                <div style={styles.itemsList}>
                  {items.map((item, index) => (
                    <div key={index} style={styles.itemTag}>
                      <span>{item}</span>
                      <button
                        onClick={() => handleRemoveItem(index)}
                        style={styles.removeButton}
                      >
                        ×
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        };

        const styles = {
          container: {
            maxWidth: '600px',
            margin: '0 auto',
            padding: '30px 20px',
            fontFamily: "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif",
            backgroundColor: '#f8f9fa',
            borderRadius: '12px',
            boxShadow: '0 4px 6px rgba(0,0,0,0.1)',
          },
          title: {
            textAlign: 'center',
            fontSize: '28px',
            marginBottom: '30px',
            color: '#333',
            fontWeight: '600',
          },
          wheelContainer: {
            display: 'flex',
            justifyContent: 'center',
            marginBottom: '30px',
            padding: '20px',
            backgroundColor: '#fff',
            borderRadius: '12px',
          },
          canvas: {
            maxWidth: '100%',
            height: 'auto',
          },
          spinButton: {
            width: '100%',
            padding: '16px',
            fontSize: '18px',
            fontWeight: 'bold',
            color: '#fff',
            backgroundColor: '#FF6B6B',
            border: 'none',
            borderRadius: '8px',
            cursor: 'pointer',
            transition: 'background-color 0.3s, transform 0.1s',
            marginBottom: '20px',
            boxShadow: '0 4px 12px rgba(255, 107, 107, 0.4)',
          },
          resultBox: {
            backgroundColor: '#fff',
            padding: '20px',
            borderRadius: '8px',
            textAlign: 'center',
            marginBottom: '20px',
            border: '2px solid #FF6B6B',
            animation: 'fadeIn 0.5s ease-in',
          },
          resultLabel: {
            fontSize: '14px',
            color: '#666',
            margin: '0 0 8px 0',
          },
          resultText: {
            fontSize: '24px',
            fontWeight: 'bold',
            color: '#FF6B6B',
            margin: '0',
          },
          itemsSection: {
            backgroundColor: '#fff',
            padding: '20px',
            borderRadius: '8px',
          },
          sectionTitle: {
            fontSize: '18px',
            marginTop: '0',
            marginBottom: '15px',
            color: '#333',
            fontWeight: '600',
          },
          inputContainer: {
            display: 'flex',
            gap: '10px',
            marginBottom: '15px',
          },
          input: {
            flex: 1,
            padding: '10px 12px',
            fontSize: '14px',
            border: '1px solid #ddd',
            borderRadius: '6px',
            fontFamily: 'inherit',
          },
          addButton: {
            padding: '10px 16px',
            fontSize: '14px',
            fontWeight: '600',
            color: '#fff',
            backgroundColor: '#4ECDC4',
            border: 'none',
            borderRadius: '6px',
            cursor: 'pointer',
            transition: 'background-color 0.3s',
          },
          itemsList: {
            display: 'flex',
            flexWrap: 'wrap',
            gap: '8px',
          },
          itemTag: {
            display: 'flex',
            alignItems: 'center',
            gap: '8px',
            padding: '8px 12px',
            backgroundColor: '#f0f0f0',
            borderRadius: '20px',
            fontSize: '14px',
            color: '#333',
          },
          removeButton: {
            background: 'none',
            border: 'none',
            fontSize: '20px',
            color: '#999',
            cursor: 'pointer',
            padding: '0',
            marginLeft: '4px',
          },
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WheelOfFortune />);
    </script>
</body>
</html>
